name: Publish runner image

on:
  push:
    branches: [main]
    paths:
      - 'images/github-runner/**'
      - '.github/workflows/publish-runner-image.yml'
  pull_request:
    paths:
      - 'images/github-runner/**'
      - '.github/workflows/publish-runner-image.yml'
  workflow_dispatch:
  schedule:
    # Weekly rebuild to pick up Google Chrome stable and OS / base-image updates
    # (Playwright-bundled browsers change only when PLAYWRIGHT_VERSION is bumped).
    - cron: '17 4 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/github-runner

# Serialize runs per ref so overlapping main/schedule runs cannot race on `latest`.
concurrency:
  group: publish-runner-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read pinned versions
        id: versions
        run: |
          runner_version="$(sed -n 's/^ARG RUNNER_VERSION=//p' images/github-runner/Dockerfile)"
          [[ -n "${runner_version}" ]] || { echo "RUNNER_VERSION not found in Dockerfile" >&2; exit 1; }
          echo "runner=${runner_version}" >> "$GITHUB_OUTPUT"

      - name: Test publish gate
        run: bash images/github-runner/publish-gate.test.sh

      - name: Decide whether to publish
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${DEFAULT_BRANCH}" ]]; then
            # Some event payloads (e.g. schedule) may lack the repository object.
            DEFAULT_BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          fi
          publish="$(bash images/github-runner/publish-gate.sh "${EVENT_NAME}" "${REF}" "${DEFAULT_BRANCH}")"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ steps.gate.outputs.publish == 'true' }}
            type=raw,value=runner-${{ steps.versions.outputs.runner }},enable=${{ steps.gate.outputs.publish == 'true' }}
            type=sha,prefix=sha-,format=short,enable=${{ steps.gate.outputs.publish == 'true' && github.event_name == 'push' }}

      # Built once; the smoke-tested image is the one that gets pushed. Scheduled
      # rebuilds skip the layer cache and re-pull the base image so they pick up
      # Google Chrome stable and OS / base-image updates; the Playwright-bundled
      # chromium, firefox and webkit change only when PLAYWRIGHT_VERSION is bumped.
      - name: Build image (amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/github-runner
          platforms: linux/amd64
          load: true
          tags: github-runner:test
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (all browsers launch headless)
        run: |
          docker run --rm --shm-size=1g \
            -v "${PWD}/images/github-runner/smoke.cjs:/smoke.cjs:ro" \
            github-runner:test node /smoke.cjs
          docker run --rm github-runner:test test -x /home/runner/run.sh
          docker run --rm github-runner:test google-chrome --version
          docker run --rm github-runner:test playwright --version

      - name: Log in to the container registry
        if: steps.gate.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push smoke-tested image
        if: steps.gate.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          pushed=0
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            docker tag github-runner:test "${tag}"
            docker push "${tag}"
            pushed=$((pushed + 1))
          done <<< "${TAGS}"
          [[ "${pushed}" -gt 0 ]] || { echo "no tags to push" >&2; exit 1; }
